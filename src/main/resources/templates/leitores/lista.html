<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Leitores')}"></head>
<body>
<aside th:replace="~{fragments :: menu}"></aside>
<main>
    <h2>Leitores</h2>
    <p class="sub">Listagem de leitores cadastrados.</p>
    <div th:if="${msg}" class="alert ok" th:text="${msg}"></div>
    <div th:if="${erro}" class="alert err" th:text="${erro}"></div>
    <div class="bar"><span></span><a class="btn" th:href="@{/leitores/novo}">Cadastrar leitor</a></div>
    <div class="tbl">
        <table>
            <tr><th>Nome</th><th>CPF</th><th>E-mail</th><th>Telefone</th><th></th></tr>
            <tr th:each="i : ${itens}">
                <td th:text="${i.nome}"></td>
                <td th:text="${i.cpf}"></td>
                <td th:text="${i.email}"></td>
                <td th:text="${i.telefone}"></td>
                <td class="act">
                    <a class="btn sec sm" th:href="@{/leitores/{id}/editar(id=${i.id})}">Editar</a>
                    <form class="inline" method="post" th:action="@{/leitores/{id}/excluir(id=${i.id})}" onsubmit="return confirm('Excluir este registro?')">
                        <button class="btn del sm">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(itens)}"><td colspan="5">Nenhum registro cadastrado. Use o botão acima para cadastrar.</td></tr>
        </table>
    </div>
</main>
</body>
</html>
