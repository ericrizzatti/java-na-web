<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Autores')}"></head>
<body>
<aside th:replace="~{fragments :: menu}"></aside>
<main>
    <h2>Autores</h2>
    <p class="sub">Listagem de autores cadastrados.</p>
    <div th:if="${msg}" class="alert ok" th:text="${msg}"></div>
    <div th:if="${erro}" class="alert err" th:text="${erro}"></div>
    <div class="bar"><span></span><a class="btn" th:href="@{/autores/novo}">Cadastrar autor</a></div>
    <div class="tbl">
        <table>
            <tr><th>Nome</th><th>Nacionalidade</th><th></th></tr>
            <tr th:each="i : ${itens}">
                <td th:text="${i.nome}"></td>
                <td th:text="${i.nacionalidade}"></td>
                <td class="act">
                    <a class="btn sec sm" th:href="@{/autores/{id}/editar(id=${i.id})}">Editar</a>
                    <form class="inline" method="post" th:action="@{/autores/{id}/excluir(id=${i.id})}" onsubmit="return confirm('Excluir este registro?')">
                        <button class="btn del sm">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(itens)}"><td colspan="3">Nenhum registro cadastrado. Use o botão acima para cadastrar.</td></tr>
        </table>
    </div>
</main>
</body>
</html>
